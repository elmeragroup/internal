name: Publish Release

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
    secrets:
      RELEASE_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      record_tag:
        description: "Prepared release to retry: v0.1.2 or canary-<full commit SHA>"
        required: true
        type: string

# id-token: write lets npm exchange the job's OIDC token for a publish token (trusted publishing).
permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # npm's trusted-publisher entries name this environment, and only main can deploy to it, so an
    # OIDC token from any other job cannot publish.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: npm-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine runs the first `npm` on PATH, and both paths promote with `npm dist-tag add`,
      # which authenticates over OIDC from npm 11.21.0. The npm bundled with .node-version is older.
      # npm stores the exchanged OIDC token in its `cli` config layer, which outranks the
      # `_authToken` line that setup-node writes to `.npmrc`.
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.1
      # npm authenticates through the job's OIDC token, so this step holds no npm token. npm signs
      # provenance for GITHUB_SHA, which on a retry dispatch is main's head rather than the
      # recorded archive's commit, so the retry publishes without provenance.
      - name: Publish checked commit or retry recorded archive
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RECORD_TAG: ${{ inputs.record_tag }}
        run: |
          if [ -n "$RECORD_TAG" ]; then
            NPM_CONFIG_PROVENANCE=false pnpm release:run retry "$RECORD_TAG"
          else
            pnpm release:run main "$SOURCE_COMMIT"
          fi
