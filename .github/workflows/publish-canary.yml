name: Publish Canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Coordinated canary version, e.g. 0.1.0-canary.0"
        required: true
        default: "0.1.0-canary.0"
        type: string

concurrency:
  group: npm-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set coordinated canary version
        run: pnpm canary:version "$CANARY_VERSION"
        env:
          CANARY_VERSION: ${{ inputs.version }}
      - run: pnpm install --lockfile-only
      - run: pnpm ci:checks
      - run: pnpm canary:pack
      - run: pnpm test:packed-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: canary-packages
          path: .artifacts/canary/
      - name: Publish verified archives
        run: pnpm canary:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
