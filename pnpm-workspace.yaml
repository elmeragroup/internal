packages:
  - packages/*
  - tooling/*

catalog:
  "@changesets/cli": 3.0.3
  "@oxlint/plugins": 1.93.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint-plugin-turbo: 2.11.10
  effect: 4.1.4
  # The Effect language service: an Effect-patched tsrs and oxlint binding, run by `pnpm lint:effect`
  # through the `effect-tsgo` proxy. Each release supports exact tsrs and oxlint versions (the "Supported
  # Package Versions" table in its README); 0.70.0 supports tsrs 0.25.0-ts7.1.0-beta and oxlint 1.93.0.
  # Bump it with tsrs and oxlint, and decide each rule it adds in tooling/typescript/effect.json.
  "@effect/tsgo": 0.70.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxc-parser: 0.158.0
  react: 19.3.1
  esbuild: 0.28.2
  tsdown: 0.23.7
  tsrs: 0.25.0-ts7.1.0-beta
  turbo: 2.11.10
  undici: 8.12.4
  vitest: 5.1.0
  yaml: 2.9.1

autoInstallPeers: true

allowBuilds:
  esbuild: true
  "@swc/core": true
  "@parcel/watcher": true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - tsrs@0.25.0-ts7.1.0-beta
  - "@tsrs/darwin-arm64@0.25.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.25.0-ts7.1.0-beta"
  - "@tsrs/win32-arm64@0.25.0-ts7.1.0-beta"
